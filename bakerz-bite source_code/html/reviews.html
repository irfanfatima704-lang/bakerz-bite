<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Customer reviews for Bakerz Bite.">
  <title>Reviews | Bakerz Bite</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/premium.css">
  <script>
    try { if (localStorage.getItem('bb-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    try {
      if (!sessionStorage.getItem('bb-intro-done')) {
        document.documentElement.classList.add('intro-pending');
        setTimeout(function () { if (!document.getElementById('bb-intro')) document.documentElement.classList.remove('intro-pending'); }, 6000);
      }
    } catch (e) {}
  </script>
</head>
<body data-page="reviews" data-nav="reviews.html">
<div class="app-shell">
  <div id="bb-symbols"></div>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="floating-bg" id="bb-float" aria-hidden="true"></div>
  <header class="bb-nav" id="site-header"></header>
  <main id="main" class="app-main">
    <section class="page-header">
      <div class="container text-center">
        <p class="eyebrow">Reviews</p><h1 class="page-title">Customer Reviews</h1>
        <p class="page-sub">See what our customers say, and share your own feedback.</p>
      </div>
    </section>
    <section class="container section-tight">
      <div class="row g-4">
        <div class="col-12 col-lg-4" id="rating-summary"></div>
        <div class="col-12 col-lg-8">
          <form class="panel-glass review-form" data-form="review" novalidate>
            <h2 class="section-title section-title-sm">Write a Review</h2>
            <div class="row g-3">
              <div class="col-12 col-md-6"><label for="rv-name" class="opt-label">Name</label><input id="rv-name" name="name" class="form-control bb-input" autocomplete="name"><p class="field-error" id="rv-err-name" role="alert" hidden></p></div>
              <div class="col-12 col-md-6"><label for="rv-cat" class="opt-label">Product or category</label><select id="rv-cat" name="cat" class="form-select bb-input"></select><p class="field-error" id="rv-err-cat" role="alert" hidden></p></div>
              <div class="col-12"><span class="opt-label d-block" id="rv-rating-label">Rating</span><div class="stars stars-input" id="rv-stars" role="radiogroup" aria-labelledby="rv-rating-label"></div><p class="field-error" id="rv-err-rating" role="alert" hidden></p></div>
              <div class="col-12"><label for="rv-text" class="opt-label">Your feedback</label><textarea id="rv-text" name="text" rows="3" class="form-control bb-input" maxlength="400"></textarea><p class="field-error" id="rv-err-text" role="alert" hidden></p></div>
              <div class="col-12"><button type="submit" class="btn-gold">Submit review</button></div>
            </div>
          </form>
          <div class="panel-glass review-thanks" id="rv-thanks" role="status" tabindex="-1" hidden>
            <span class="rt-icon" data-icon="check"></span>
            <h2 class="section-title section-title-sm">Thank you, <span id="rv-thanks-name">friend</span>!</h2>
            <p class="lead-text">Your review has been submitted. We love hearing from you, and your feedback helps us bake better every day.</p>
            <div class="d-flex flex-wrap gap-3 justify-content-center">
              <a href="#rv-list" class="btn-gold">See all reviews</a>
              <button type="button" class="btn-soft" id="rv-again">Write another review</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="container section-tight">
      <div class="filter-bar panel-glass">
        <div class="row g-3 align-items-end">
          <div class="col-6 col-md-3"><label for="rv-rating-filter" class="opt-label">Rating</label><select id="rv-rating-filter" class="form-select bb-input"><option value="0">All ratings</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></div>
          <div class="col-6 col-md-3"><label for="rv-cat-filter" class="opt-label">Category</label><select id="rv-cat-filter" class="form-select bb-input"></select></div>
          <div class="col-12 col-md-6 d-flex align-items-center gap-3"><button type="button" class="chip-clear" id="rv-clear">Clear filters</button><span class="result-count" id="rv-count" aria-live="polite"></span></div>
        </div>
      </div>
      <div id="rv-list"></div>
    </section>
  </main>
  <footer class="bb-footer" id="site-footer"></footer>
  <div id="bb-overlays"></div>
  <div class="bb-ticker" id="bb-ticker"></div>
</div>
<script src="../js/data.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/script.js"></script>
<script src="../js/premium.js"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/jquery-enhancements.js"></script>
</body>
</html>
